name: Nays Restock-Alarm

on:
  repository_dispatch:
    types: [check]          # wird alle 5 Min von cron-job.org ausgelöst
  workflow_dispatch:        # manueller Test

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Lagerstatus prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          from datetime import datetime, timezone
          TOPIC = os.environ["NTFY_TOPIC"]
          SHOP = "https://naysbaits.com/products/nays-adventskalender-2026?variant=56911610413391"
          API = "https://naysbaits.com/products/nays-adventskalender-2026.js"

          def push(text, prio, tag):
              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}", data=text.encode("utf-8"), method="POST",
                  headers={"Title": "Nays Adventskalender", "Priority": prio,
                           "Tags": tag, "Click": SHOP})
              urllib.request.urlopen(req, timeout=20).read()

          try:
              req = urllib.request.Request(API, headers={"User-Agent": "Mozilla/5.0"})
              data = json.load(urllib.request.urlopen(req, timeout=20))
          except Exception as e:
              print("Shop nicht erreichbar:", e)
              raise SystemExit(0)

          available = bool(data.get("available")) or any(
              v.get("available") for v in data.get("variants", []))
          print("VERFUEGBAR" if available else "ausverkauft")
          now = datetime.now(timezone.utc)

          if available:
              push("JETZT VERFÜGBAR! Tippen zum Kaufen.", "urgent", "rotating_light")
          elif os.environ.get("EVENT") == "workflow_dispatch":
              push("Test erfolgreich: Bot läuft. Noch ausverkauft.", "default", "white_check_mark")
          elif now.minute < 5:  # jede volle Stunde
              push("Bot läuft – Kalender noch ausverkauft.", "low", "hourglass")
          EOF
